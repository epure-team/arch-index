name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # The language servers are installed below, so a test that reports "not
    # exercised" here means that install rotted, not that the machine is bare.
    # Without this the LSP-path tests would go back to passing while covering
    # nothing, which is the failure mode the Tezt port exists to remove.
    env:
      ARCH_TEZT_REQUIRE_SERVERS: '1'
      # This runner has a network, so an npm-registry skip here is a real gap,
      # not a developer working offline: multilang.ml is the only cover for the
      # merged polyglot index and it ran zero assertions, reporting SUCCESS,
      # when the registry was unreachable.
      ARCH_TEZT_REQUIRE_NETWORK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the change-impact step below diffs against the PR base (or HEAD~1 on a
          # push). With the default fetch-depth of 1 neither commit exists in the clone, and the
          # step fails on every run.
          fetch-depth: 0
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The LSP-path tests drive REAL language servers: tezt/tests/multilang.ml
      # and both report "not exercised" without them
      # and cover precisely nothing, which is what they did here until now.
      #
      # The OCaml server is NOT installed here: `ocamllsp` is an opam package, so
      # it is declared as a :with-test dependency in dune-project and comes in
      # with `opam install --deps-only --with-test` below. It is probed by
      # running it, in its own step, for the same reason these three are.
      #
      # Versions are pinned so that a regression on the server side arrives as a
      # deliberate bump rather than as a mystery failure on an unrelated PR, and
      # each one is PROBED BY RUNNING IT: `rustup component add` writes a shim
      # that answers `command -v` whether or not the component behind it exists,
      # so a PATH check would let a broken install through to an empty index.
      - name: Install language servers
        run: |
          go install golang.org/x/tools/gopls@v0.23.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          npm i -g typescript-language-server@5.3.0 typescript@5
          rustup component add rust-analyzer
          gopls version
          typescript-language-server --version
          rust-analyzer --version
      - name: Install deps
        run: opam install --deps-only --with-test --yes .
      # The OCaml language server, probed the same way as the other three and for
      # the same reason. Without it Arch_tezt.index_project spawns nothing, the
      # flat producer writes a database with zero call rows, and
      # tezt/tests/point_free_aliases.ml (S5) fails on its own premise assertion
      # -- which is how this absence was found. A separate step so that a future
      # disappearance is named "the OCaml language server is missing" rather than
      # diagnosed from an empty result set.
      - name: Verify the OCaml language server
        run: opam exec -- ocamllsp --version
      # sqlite3 is a direct dependency of the self-index smoke test further down (it shells out
      # to the CLI directly) — but no step installed it explicitly before this one; ubuntu-latest
      # ships it, but relying on that implicitly is the same "green without data" shape this
      # pipeline refuses everywhere else. Its own named step so it stays load-bearing
      # infrastructure independent of any one other step's fate. Idempotent.
      - name: Install sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
      # tezt/tests/sarif_out.ml (roadmap 2.1) validates `arch-rules --format sarif` against the
      # vendored SARIF 2.1.0 schema, which is JSON Schema draft-04. The opam package `jsonschema`
      # (0.1.0) was tried and rejected: it silently accepted a SARIF document missing required
      # top-level fields, so it cannot be relied on to make CHECK-4 fail when it should. python3's
      # `jsonschema` correctly rejects the same document via its `Draft4Validator`, and that test
      # shells out to it — declared here, explicitly, per this repo's own PR #69 lesson (a tool
      # assumed present and declared nowhere is a bug waiting to happen). Pinned so a validator
      # regression arrives as a deliberate version bump, not a mystery CI failure on an unrelated
      # PR. ubuntu-latest ships python3 and pip already; this only adds the one library.
      - name: Install SARIF schema validator (python3 jsonschema)
        run: pip install --user 'jsonschema==4.26.0'
      # Every other tool installed above is PROBED BY RUNNING IT (ocamllsp --version, gopls
      # version, ...) so an install that silently did nothing is caught here rather than as an
      # unrelated test failure downstream. `pip install --user` had no such probe; add one.
      - name: Verify python3 jsonschema is importable
        run: python3 -c "import jsonschema; print(jsonschema.__version__)"
      - name: Build
        run: opam exec -- dune build --root .
      # `dune test` also runs the Tezt suite under tezt/, which covers the CMT
      # indexer's module-language shapes — including the two soundness ratchets in
      # tezt/tests/nested_module_qualification.ml and tezt/tests/must_null_ceiling.ml, migrated
      # off a standalone checks/ Node runtime so they run here like everything else — and, now
      # that the servers above are installed, the polyglot indexing path for real.
      - name: Unit and integration tests
        run: |
          # `eval opam env`, not just `opam exec --`: the Tezt suite drives `dune`
          # and `go` against OTHER projects at RUNTIME (the pcc and callgraph-go
          # tests build throwaway repos), so they need to be resolvable via bare
          # PATH in this shell, not only inside opam exec's child.
          eval "$(opam env)"
          dune test --root .
      # $RUNNER_TEMP, not /tmp. The self-index database is written by this step and
      # read by the two below, so it needs a stable name — and a stable name
      # directly in a world-writable /tmp is symlink-preemptable, the same class as
      # the fixed scratch names review removed from scripts/callgraph-diff.sh.
      # $RUNNER_TEMP is the runner's own per-job scratch directory, emptied between
      # jobs, so it gives the stability those steps need without the shared-
      # directory exposure. It is a DEFAULT environment variable, already present in
      # every step's shell: it is spelled as a plain shell expansion here, not as a
      # runner.temp expression, and not hoisted into the job-level `env:`, because
      # the `runner` context is NOT available in `jobs.<id>.env` (only github, needs,
      # strategy, matrix, vars, secrets and inputs are) — it becomes available at
      # `jobs.<id>.steps.*`. Referencing it a level up fails the whole workflow at
      # startup with "Unrecognized named-value: 'runner'", so the job never
      # dispatches at all. Per-step `env:` would work but reintroduces the three-way
      # duplication; the default variable avoids both.
      - name: Self-index smoke test
        run: |
          BIN="./_build/default/bin/arch_callgraph_ocaml/arch_callgraph_ocaml.exe"
          opam exec -- "$BIN" \
            --build-dir=_build/default/lib/arch_index \
            --db-path="$RUNNER_TEMP/self.db" \
            --schema-path=architecture-schema.sql
          sqlite3 "$RUNNER_TEMP/self.db" \
            "SELECT 'modules: ' || count(*) FROM modules; \
             SELECT 'functions: ' || count(*) FROM functions; \
             SELECT 'calls: ' || count(*) FROM calls;" \
            > "$RUNNER_TEMP/self-stats.txt"
          diff test/fixtures/self-index-stats.txt "$RUNNER_TEMP/self-stats.txt" \
            || { echo "Golden file mismatch — update: see docs/adr/001-self-index-golden.md"; exit 1; }

      # The recalibration gate. Until now this script was wired to nothing: no CI
      # step ran it, no dune rule ran it, and six rounds of review on it moved
      # no existing test because there was no test to move. Its --self-test half
      # now runs in the Tezt suite above; this is the measuring half.
      #
      # --check attributes each pinned constant's movement across a 2x2 (base vs
      # new binary, base vs new corpus) and exits 1 when a constant is stale, 2
      # when the measurement is degraded, implausible, or the pin is unreadable.
      # It builds two pristine worktrees of its own, which is why it is a
      # separate step rather than folded into the smoke test above.
      #
      # `fetch-depth: 0` on the checkout is load-bearing here: the default
      # baseline is merge-base(HEAD, origin/main), which does not exist in a
      # shallow clone. The explicit fetch covers the push-event case, where the
      # remote-tracking ref for main may not have been created.
      #
      # On that push event the 2x2 is a TAUTOLOGY and it is worth knowing why
      # the step still runs. `push: branches: [main]` means HEAD == origin/main,
      # so the merge-base IS HEAD, base and new are the same commit, and
      # A = B = C = D always -- the attribution half can only ever report
      # SOURCE_ONLY and proves nothing. What still has value there is the
      # CURRENCY half: it re-measures main's own tree and catches a pin that
      # has drifted from what main actually measures, which is the drift this
      # tool was written for. The attribution half earns its keep on
      # pull_request, where the two refs really differ.
      #
      # The two non-zero exits are treated DIFFERENTLY, and that is the whole
      # design of this step:
      #
      #   exit 2 (REFUSED) is hard. It means the tool could not measure, or
      #     measured something it will not believe: a degraded cell, a corpus
      #     below the adequacy floor, a component collapsed below half its pin,
      #     an unreadable or doubly-defined constant.
      #
      #     THREE of those four say the GATE is not working. The fourth --
      #     implausible -- is the one case where the refusal may be a property
      #     of the BRANCH: a genuine >50% resolution gain has exactly the same
      #     shape as a query that stopped matching, and that is not
      #     hypothetical here, this repository has recorded a MAY_TOP move of
      #     79% -> 3.9%. Telling the author of such a branch that "this is a
      #     failure of the gate, not of the branch" is both wrong and
      #     unactionable, and the script's own comment says where that ends up:
      #     "a gate that refuses wrongly is a gate people learn to bypass".
      #     So the two are split below on the refusal-class line the script
      #     prints, and the plausibility arm says what a human should do.
      #
      #     Round 8: EVERY exit-2 cause now names itself on that line, not just
      #     the implausible one. The class is per-METRIC while this branch is
      #     per-RUN, so a run in which the golden refused as implausible and the
      #     ceiling refused with an unreadable pin used to take the plausibility
      #     arm on the strength of the one class line present -- telling a
      #     developer to recalibrate BY HAND on a run whose gate was broken,
      #     which is this step's stated purpose exactly inverted. The condition
      #     below is now "every class line says implausible".
      #
      #   exit 1 (STALE) is advisory here, and NOT because staleness is
      #     tolerable. It is already hard-gated: the "Self-index smoke test"
      #     step above diffs the golden and fails on a mismatch, and
      #     must_null_ceiling.ml fails the Tezt suite on a breach. Making it
      #     hard a second time would add exactly one new obligation -- a branch
      #     that IMPROVES resolution by more than the headroom would redden CI
      #     until it recalibrated -- and that deserves to land as its own
      #     deliberate change, not as a side effect of wiring the tool up.
      #
      # So this step adds no new way for an ordinary PR to fail, and one new
      # way for a broken measurement to be caught.
      #
      # RECORD THE COST OF THAT CHOICE, rather than letting a future reader
      # infer that exit 1 is "covered". A `::warning::` is in practice unread:
      # it does not fail the job, it does not block a merge, and nobody opens
      # a green run to look for it. The staleness signal survives only because
      # it is hard-gated twice elsewhere (the golden diff, and
      # must_null_ceiling's own assertion) -- but the GAIN half of exit 1, a
      # branch that improves the ratchet by more than the headroom, is gated
      # NOWHERE ELSE, so wiring it to a warning discards it. That is a
      # deliberate, temporary trade to keep this PR from changing what makes
      # CI red, NOT a judgement that a warning is sufficient. Turning the GAIN
      # signal into something enforced is a tracked follow-up and needs to
      # land as its own change, with the recalibration workflow it implies.
      - name: Recalibration gate (self)
        env:
          # L7, accepted knowingly rather than left at dune's default-off. This
          # step builds two PRISTINE worktrees and indexes four corpora, so it
          # pays for two full `dune build`s that share nothing with the "Build"
          # step above -- ~2-3 minutes locally and materially more on a hosted
          # runner.
          #
          # ROUND 8 CORRECTION. What stood here was "the two worktrees differ
          # from this one only by checkout, so most of that compilation is
          # genuinely shared". That overstates it by a factor of about two. This
          # env: block applies to THIS STEP ONLY: the "Build" step above runs
          # with the cache at dune's default-off and populates nothing, and
          # ~/.cache/dune does not persist across jobs on ubuntu-latest. So
          # nothing is shared with the main build, and nothing is shared with
          # the next run. What IS shared -- and it is real -- is base-worktree
          # <-> new-worktree WITHIN this step: the two checkouts differ only by
          # the branch's own diff, so the unchanged majority of the tree
          # compiles once. Worth having; half of what was claimed.
          #
          # It is a cache of BUILD ARTEFACTS keyed on their inputs, not of the
          # measurement: each cell is still indexed from its own tree by the
          # binary built for that tree, so a cache hit cannot make a stale
          # producer measure a new corpus -- the exact trap this script's
          # header warns about, and the reason to say so here.
          DUNE_CACHE: enabled
          DUNE_CACHE_STORAGE_MODE: copy
        run: |
          eval "$(opam env)"
          git fetch --no-tags origin main
          set +e
          # Captured as well as shown, so the refusal ARM below can tell the
          # four exit-2 causes apart. PIPESTATUS, not $?, or this would read
          # tee's status -- the same pipefail trap the script itself documents.
          ./scripts/recalibrate.sh --check 2>&1 | tee /tmp/recalibrate-check.log
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0) echo "recalibrate: every pinned constant is current" ;;
            1) echo "::warning::recalibrate --check reports a STALE pinned constant."
               echo "Run scripts/recalibrate.sh --explain to see the attribution," \
                    "then --write to install what is attributable to source change alone." ;;
            *) # EVERY class line must say implausible, not merely one of them.
               # The class is per-METRIC and this branch is per-RUN: a run whose
               # golden refused as implausible and whose ceiling refused with an
               # unreadable pin used to take the plausibility arm and tell the
               # developer to recalibrate BY HAND, on a run whose gate was
               # broken. So: at least one implausible class line, AND no class
               # line that is not implausible. With no class line at all the
               # first test fails and the else arm runs -- fail-closed, which is
               # what a refusal that forgot to name itself deserves.
               if grep -q 'refusal-class=implausible' /tmp/recalibrate-check.log \
                  && ! grep -o 'refusal-class=[a-z-]*' /tmp/recalibrate-check.log \
                     | grep -qv 'refusal-class=implausible'; then
                 echo "::error::recalibrate --check REFUSED (exit $rc): a measured component" \
                      "collapsed below half its pinned value. Unlike the other refusals, this" \
                      "one MAY be a property of your branch: a genuine >50% resolution gain is" \
                      "indistinguishable in shape from a query that stopped matching, and this" \
                      "repository has recorded a MAY_TOP move of 79% -> 3.9%. If the movement" \
                      "is REAL, recalibrate BY HAND and record why in the commit message --" \
                      "the output above names the file, the line, and the measured value." \
                      "--write will not do it for you; it refuses on this input by design."
               else
                 echo "::error::recalibrate --check REFUSED (exit $rc): the measurement is" \
                      "degraded, or a pinned constant could not be read. This is a failure of" \
                      "the gate, not of the branch -- see the output above."
               fi
               exit "$rc" ;;
          esac

      - name: Architecture rules (self)
        run: |
          # --on-vacuous fail is the point: if a rule's selector stops matching (a rename, a
          # split), it turns green forever and looks like coverage. That must break the build.
          ./arch-rules "$RUNNER_TEMP/self.db" arch-rules.txt --on-vacuous fail

      - name: Change-impact briefing (self)
        run: |
          # Not a gate — but running it on every build is how a broken briefing gets noticed
          # before someone relies on it in review.
          ./arch-impact "$RUNNER_TEMP/self.db" --diff "${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD" --repo .

  # mcp-kit lives in a PRIVATE repo (epure-team/ocaml-mcp), so `opam pin` needs credentials that
  # a fork or an unconfigured checkout does not have. Rather than let the mcp job fail on every
  # such run — a permanently-red check teaches people to ignore it — decide up front whether the
  # credential exists, and say so loudly when it does not. `secrets` is not readable from a
  # job-level `if:`, hence this one-step job to turn it into an output.
  mcp-credentials:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.OCAML_MCP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=MCP server NOT verified in this run::OCAML_MCP_TOKEN is unset, so bin/arch_mcp was neither built nor protocol-tested. mcp-kit is pinned from the private repo epure-team/ocaml-mcp and cannot be fetched without a token. Do not read a green CI as evidence that the MCP server still compiles."
          fi

  mcp:
    # Separate job because it needs an opam PIN: mcp-kit is not published. bin/arch_mcp is behind
    # `(enabled_if %{env:ARCH_MCP=no} = yes)`, so the main build never sees it; this job is the
    # only thing that stops the target rotting unnoticed behind that flag.
    needs: mcp-credentials
    if: needs.mcp-credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - name: Pin mcp-kit
        env:
          TOKEN: ${{ secrets.OCAML_MCP_TOKEN }}
        run: |
          opam pin add -y --no-action mcp-kit \
            "https://x-access-token:${TOKEN}@github.com/epure-team/ocaml-mcp.git"
      - name: Install deps
        # --deps-only . as well as mcp-kit: selftest-mcp.sh drives the server against an index it
        # builds with arch-load and cross-checks with arch-query, so this job needs the whole
        # toolchain, not just the server's own dependencies.
        run: |
          opam install --deps-only --with-test --yes .
          opam install --yes mcp-kit
      - name: Build the MCP server and the CLIs it is checked against
        env:
          ARCH_MCP: 'yes'
        run: |
          opam exec -- dune build --root . bin/arch_mcp/arch_mcp.exe bin/arch_load bin/arch_query
          # A false enabled_if makes `dune build <target>` exit 0 while producing nothing, so a
          # green dune is not evidence. Assert the binary.
          test -x _build/default/bin/arch_mcp/arch_mcp.exe \
            || { echo "arch_mcp was SKIPPED, not built — ARCH_MCP or the pin did not take"; exit 1; }
      - name: Protocol smoke test
        run: |
          chmod +x selftest-mcp.sh
          # selftest-mcp.sh SKIPs when the binary is absent. The step above already proved it is
          # present, so a skip here would mean something moved it — fail instead of passing.
          out="$(./selftest-mcp.sh)"; rc=$?
          echo "$out"
          [ $rc -eq 0 ] || exit $rc
          case "$out" in *SKIP*) echo "selftest-mcp skipped despite a built binary"; exit 1;; esac

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            profile: static
            extra_setup: sudo apt-get install -y libsqlite3-dev libgmp-dev zlib1g-dev
          - os: macos-latest
            suffix: macos-arm64
            profile: release
            extra_setup: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - name: Platform setup
        if: matrix.extra_setup != ''
        run: ${{ matrix.extra_setup }}
      - name: Install deps and build
        run: |
          opam install --deps-only --with-test --yes .
          opam exec -- dune build --root . --profile=${{ matrix.profile }}
      - name: Package binaries
        run: |
          mkdir -p dist
          # arch_mcp is deliberately absent: it needs a pin of a private library, so it cannot be
          # produced by a tag build. Everything else a user invokes gets shipped — the five query
          # and analysis CLIs were added to the repo without being added here, which meant a
          # release tarball contained tools the docs told people to run.
          # A missing binary FAILS the job. Skipping it silently publishes a release that is
          # quietly missing a tool the docs tell people to run — the same "green without data"
          # shape this pipeline refuses everywhere else.
          missing=""
          for bin in arch_index_cli arch_serve arch_callgraph_ocaml \
                     arch_query arch_load arch_rules arch_impact arch_mutants arch_coverage; do
            src=$(find _build -name "${bin}.exe" | head -1)
            if [ -z "$src" ]; then missing="$missing $bin"; continue; fi
            cp "$src" "dist/${bin}-${{ matrix.suffix }}"
            strip "dist/${bin}-${{ matrix.suffix }}" || true
          done
          if [ -n "$missing" ]; then
            echo "::error::release build produced no binary for:$missing — refusing to publish a partial release"
            exit 1
          fi
          ls -la dist/
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          body_path: CHANGELOG.md
